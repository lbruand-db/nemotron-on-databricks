[project]
name = "nemotron-dbx"
version = "0.1.0"
description = "Shared code for fine-tuning and serving NVIDIA Nemotron document models on Databricks"
requires-python = ">=3.12"
# Runtime dependencies come from the Databricks AI Runtime environment (databricks_ai_v6):
# torch, torchvision, numpy, pillow, pyarrow, pandas, huggingface_hub, mlflow, databricks-sdk.
# Anything added on top of it is pinned in the recipe workload.yaml, not here.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pycocotools", "pyyaml", "transformers==5.8.1", "peft==0.19.1", "zss==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_dbx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["recipes/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
