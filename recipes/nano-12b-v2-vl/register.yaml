# Stage 2: smoke-test the merged checkpoint of a stage-1 run with vLLM and register it in Unity Catalog for
# Custom LLM Serving. Run from the repo root:
#   databricks air run -f recipes/nano-12b-v2-vl/register.yaml --override parameters.source_training_run_id=<MLFLOW_RUN_ID>
experiment_name: nemotron-nano-12b-v2-vl

mlflow_run_name: nano-vl-register

environment:
  # custom_llm serving packs this environment (env_pack), so don't install anything on top of it here.
  version: databricks_ai_v6

compute:
  accelerator_type: GPU_1xH100
  num_accelerators: 1

code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - recipes/nano-12b-v2-vl

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

parameters:
  source_training_run_id: ""
  # Requires USE CATALOG, USE SCHEMA, CREATE MODEL on the target schema.
  registered_model_name: am_rag_fevm_catalog.nemotron.nemotron_nano_12b_v2_vl_ft
  # pyfunc: classic pyfunc running vLLM in the container (pinned pip env, no env_pack).
  # custom_llm: Custom LLM Serving (vLLM entrypoint + env_pack); blocked on the test workspace (SPEC OQ-5).
  serving: pyfunc
  # Extra vLLM flags for the serving entrypoint (also used by the smoke test), e.g. --enforce-eager.
  vllm_extra_args: ""
  # Extra NAME=VALUE environment for vLLM (space-separated), e.g. VLLM_TEST_FORCE_FP8_MARLIN=1.
  vllm_env: ""
  # Cap the smoke test's vLLM at the serving GPU's memory (GiB), so a config that won't fit fails here and not
  # after an hour-long deployment. 20.2 = 0.90 of an A10G (GPU_MEDIUM); 0 = no cap (serving GPU >= this one).
  smoke_gpu_budget_gib: 0

max_retries: 0
timeout_minutes: 90

command: |
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH/src:${PYTHONPATH:-}"
  python -u recipes/nano-12b-v2-vl/register.py
