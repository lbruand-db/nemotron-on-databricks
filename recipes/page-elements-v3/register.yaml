# Stage 2: register the fine-tuned page-elements-v3 weights of a stage-1 run in Unity Catalog.
# Run from the repo root:
#   databricks air run -f recipes/page-elements-v3/register.yaml --watch \
#     --override parameters.source_training_run_id=<MLFLOW_RUN_ID>
experiment_name: nemotron-page-elements-v3

mlflow_run_name: page-elements-v3-register

environment:
  version: databricks_ai_v6

compute:
  accelerator_type: GPU_1xA10
  num_accelerators: 1

code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - recipes/page-elements-v3

env_variables:
  HF_HOME: /tmp/hf
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

parameters:
  source_training_run_id: ""
  # Requires USE CATALOG, USE SCHEMA, CREATE MODEL on the target schema.
  registered_model_name: am_rag_fevm_catalog.nemotron.nemotron_page_elements_v3_ft
  # env_pack=true (pack the AIR environment) crash-loops / times out for this classic pyfunc on Model Serving
  # (SPEC OQ-17); the default builds the serving image from pinned pip requirements instead.
  env_pack: false

max_retries: 0
timeout_minutes: 45

command: |
  cd "$CODE_SOURCE_PATH"
  export PYTHONPATH="$CODE_SOURCE_PATH/src:${PYTHONPATH:-}"
  python recipes/page-elements-v3/register.py
